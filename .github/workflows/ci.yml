name: SDK CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/build-sdk-lab.mjs
      - name: Package SDK test lab
        run: |
          cd dist/sdk-test-lab
          zip -qr ../ToyGameKit-SDK-Test-Lab.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toy-sdk-test-lab
          path: dist/ToyGameKit-SDK-Test-Lab.zip
          if-no-files-found: error
      - name: Package development SDK
        run: |
          mkdir -p dist/npm
          npm pack --ignore-scripts --pack-destination dist/npm
      - name: Verify packaged SDK in an independent game
        run: node scripts/smoke-sdk-consumer.mjs dist/npm/*.tgz
      - name: Build Vite consumer from packaged SDK
        working-directory: examples/vite-consumer
        run: |
          npm ci --ignore-scripts --no-audit
          mkdir -p node_modules/toy-game-kit
          tar -xzf ../../dist/npm/*.tgz --strip-components=1 -C node_modules/toy-game-kit
          node prepare.mjs
          ./node_modules/.bin/vite build
      - name: Inspect built artifacts with pinned official Doctor
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/bilibili/toy/f418536cc463ad598a775bc1ad6cfb0505905ab7/skills/toy/scripts/toy_doctor.py -o "$RUNNER_TEMP/toy_doctor.py"
          sh scripts/preflight.sh "$RUNNER_TEMP/toy_doctor.py"
      - name: Verify Lab and installed SDK in Chromium
        run: node scripts/smoke-sdk-lab.mjs --consumer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toy-game-kit-sdk
          path: dist/npm/*.tgz
          if-no-files-found: error
